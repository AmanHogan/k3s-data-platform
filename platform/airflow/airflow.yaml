# Apache Airflow — job orchestration for the data platform.
# Standalone deployment: webserver + scheduler in one pod.
# Uses PostgreSQL as the metadata database.
# REST API enabled for the frontend Jobs page.
#
# DAGs are loaded from a ConfigMap (simple for homelab — no git-sync needed).
# Add new DAGs by updating the configmap and restarting.
#
# Access via NodePort on Tailscale IP:
#   http://100.112.249.53:30880
#
# Create the Airflow user secret first:
#   kubectl create secret generic airflow-creds \
#     --namespace data-platform \
#     --from-literal=AIRFLOW_ADMIN_USER=admin \
#     --from-literal=AIRFLOW_ADMIN_PASSWORD=<your-password>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: data-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: data-platform
data:
  # First DAG: CSV → Spark transform → Parquet on MinIO (medallion pattern)
  medallion_etl.py: |
    """
    Medallion ETL — Bronze → Silver → Gold pipeline.

    Submits PySpark jobs to the Spark cluster that:
    1. Bronze: ingests raw CSV from MinIO raw-data bucket
    2. Silver: cleans and validates
    3. Gold: aggregates for analytics

    Schedule: daily at 3am (or manual trigger from the UI).
    """
    from datetime import datetime, timedelta
    from airflow import DAG
    from airflow.operators.bash import BashOperator

    default_args = {
        "owner": "data-platform",
        "depends_on_past": False,
        "email_on_failure": False,
        "retries": 1,
        "retry_delay": timedelta(minutes=5),
    }

    # Spark Thrift Server JDBC URL (SQL queries run here)
    THRIFT_URL = "jdbc:hive2://spark-thrift.data-platform.svc.cluster.local:10000"

    with DAG(
        dag_id="medallion_etl",
        default_args=default_args,
        description="Bronze → Silver → Gold medallion ETL pipeline",
        schedule_interval="0 3 * * *",
        start_date=datetime(2026, 8, 1),
        catchup=False,
        tags=["etl", "medallion", "spark"],
    ) as dag:

        bronze = BashOperator(
            task_id="bronze_ingest",
            bash_command="echo 'Bronze ingest placeholder — will run PySpark via spark-submit'",
        )

        silver = BashOperator(
            task_id="silver_transform",
            bash_command="echo 'Silver transform placeholder — will run PySpark via spark-submit'",
        )

        gold = BashOperator(
            task_id="gold_aggregate",
            bash_command="echo 'Gold aggregate placeholder — will run PySpark via spark-submit'",
        )

        bronze >> silver >> gold
  # Factory DAG: turns rows in dataplatform.scheduled_jobs (written by the
  # Kubenex notebook "Schedule" button) into one DAG per job at parse time.
  kubenex_scheduled_jobs.py: |
    """
    Kubenex scheduled-job factory.

    Airflow's DAG folder here is a read-only ConfigMap, so the web app cannot drop
    a file in it to schedule work — and giving the app Kubernetes API credentials
    just to write DAGs would be a large privilege grant for a small feature.

    Instead the app writes job definitions into the platform Postgres, and this
    single file turns each row into a DAG at parse time. Adding a scheduled job
    therefore needs no cluster access and no redeploy.

    Each statement in a job becomes one task, chained in order, executed against
    the SQL gateway over HTTP.
    """

    import os
    import json
    import logging
    from datetime import datetime, timedelta

    import psycopg2
    import requests
    from airflow import DAG
    from airflow.operators.python import PythonOperator

    log = logging.getLogger(__name__)

    PG_HOST = os.environ.get("PG_HOST", "postgres.data-platform.svc.cluster.local")
    PG_PORT = int(os.environ.get("PG_PORT", "5432"))
    PG_DB = os.environ.get("PG_DB", "dataplatform")
    PG_USER = os.environ.get("POSTGRES_USER", "")
    PG_PASSWORD = os.environ.get("POSTGRES_PASSWORD", "")

    GATEWAY = os.environ.get(
        "SQL_GATEWAY_URL",
        "http://sql-gateway.data-platform.svc.cluster.local:8080",
    )

    DEFAULT_ARGS = {
        "owner": "kubenex",
        "depends_on_past": False,
        "email_on_failure": False,
        "retries": 1,
        "retry_delay": timedelta(minutes=5),
    }


    def run_statement(sql: str) -> None:
        """Execute one statement through the gateway, failing the task on error."""
        resp = requests.post(
            f"{GATEWAY}/query",
            json={"query": sql, "source": "scheduled-job"},
            timeout=600,
        )
        # The gateway returns 400 with a JSON body for statement errors.
        if resp.status_code >= 400:
            try:
                message = resp.json().get("error", resp.text)
            except ValueError:
                message = resp.text
            raise RuntimeError(f"SQL failed: {message}")

        body = resp.json()
        if body.get("error"):
            raise RuntimeError(f"SQL failed: {body['error']}")

        log.info("ok in %sms, %s rows", body.get("durationMs"), body.get("rowCount"))


    def load_jobs() -> list[dict]:
        """Read enabled job definitions. Never raise — a database blip must not
        wipe every generated DAG out of the scheduler."""
        try:
            with psycopg2.connect(
                host=PG_HOST,
                port=PG_PORT,
                dbname=PG_DB,
                user=PG_USER,
                password=PG_PASSWORD,
                connect_timeout=5,
            ) as conn, conn.cursor() as cur:
                cur.execute(
                    """
                    SELECT dag_id, name, schedule, statements, source_notebook
                    FROM scheduled_jobs
                    WHERE enabled
                    ORDER BY id
                    """
                )
                rows = cur.fetchall()
        except Exception as exc:  # noqa: BLE001
            log.warning("could not load scheduled jobs: %s", exc)
            return []

        jobs = []
        for dag_id, name, schedule, statements, notebook in rows:
            # psycopg2 returns jsonb already decoded; tolerate a text column too.
            if isinstance(statements, str):
                statements = json.loads(statements)
            jobs.append(
                {
                    "dag_id": dag_id,
                    "name": name,
                    "schedule": schedule,
                    "statements": statements or [],
                    "notebook": notebook,
                }
            )
        return jobs


    for job in load_jobs():
        dag = DAG(
            dag_id=job["dag_id"],
            default_args=DEFAULT_ARGS,
            description=(
                f"{job['name']}"
                + (f" (from notebook {job['notebook']})" if job["notebook"] else "")
            ),
            schedule_interval=job["schedule"],
            start_date=datetime(2026, 1, 1),
            catchup=False,
            tags=["kubenex", "scheduled"],
        )

        previous = None
        for index, statement in enumerate(job["statements"], start=1):
            task = PythonOperator(
                task_id=f"statement_{index}",
                python_callable=run_statement,
                op_kwargs={"sql": statement},
                dag=dag,
            )
            if previous:
                previous >> task
            previous = task

        # Airflow discovers DAGs by scanning module globals.
        globals()[job["dag_id"]] = dag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: data-platform
  labels:
    app: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: apache/airflow:2.10.5-python3.11
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Set up the DB connection string
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.data-platform.svc.cluster.local:5432/airflow"

              # Core config
              export AIRFLOW__CORE__EXECUTOR=LocalExecutor
              export AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
              export AIRFLOW__CORE__LOAD_EXAMPLES=False

              # Enable REST API (for the frontend)
              export AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth

              # Webserver config
              export AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
              export AIRFLOW__WEBSERVER__RBAC=True

              # Initialize the database
              airflow db migrate

              # Create admin user
              airflow users create \
                --username "${AIRFLOW_ADMIN_USER}" \
                --password "${AIRFLOW_ADMIN_PASSWORD}" \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@homelab.local 2>/dev/null || true

              # Start scheduler in background, webserver in foreground
              airflow scheduler &
              exec airflow webserver --port 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: airflow-creds
                  key: AIRFLOW_ADMIN_USER
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-creds
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          ports:
            - containerPort: 8080
              name: webserver
          volumeMounts:
            # One subPath per DAG file. Mounting the ConfigMap as a directory
            # brings ..data symlinks that make Airflow's DAG walker loop.
            - name: dags
              mountPath: /opt/airflow/dags/kubenex_scheduled_jobs.py
              subPath: kubenex_scheduled_jobs.py
            - name: dags
              mountPath: /opt/airflow/dags/medallion_etl.py
              subPath: medallion_etl.py
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 300m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          # pip install + db migrate + user creation takes 2-3 minutes on first boot
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 10
          # The 1s default timeout failed under scheduler load and flapped the pod
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: dags
          configMap:
            name: airflow-dags
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: data-platform
  labels:
    app: airflow
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
    - name: webserver
      port: 8080
      targetPort: 8080
      nodePort: 30880
