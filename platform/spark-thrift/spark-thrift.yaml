# Spark Thrift Server — HiveServer2-compatible SQL endpoint.
# Uses PostgreSQL directly as the Hive Metastore backend (no standalone HMS).
# Connects to the Spark cluster for compute.
#
# IMPORTANT: the hive_metastore database must be pre-initialized with the
# Hive 2.3 schema (hive-schema-2.3.0.postgres.sql) BEFORE first start.
# Do NOT rely on datanucleus.schema.autoCreateAll — lazy schema DDL
# deadlocks against in-flight metastore transactions in PostgreSQL
# (create_table hangs forever holding the Hive client lock).
#
# The frontend's SQL Editor and Data Catalog query through here.
#
# JDBC URL (from within the cluster):
#   jdbc:hive2://spark-thrift.data-platform.svc.cluster.local:10000
#
# Access via NodePort on Tailscale IP for tools like DBeaver:
#   jdbc:hive2://100.112.249.53:30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-thrift
  namespace: data-platform
  labels:
    app: spark-thrift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-thrift
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: spark-thrift
    spec:
      containers:
        - name: thrift
          image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Unset k8s-injected env vars that conflict with Spark
              unset SPARK_MASTER_PORT SPARK_MASTER_HOST SPARK_WORKER_PORT

              # Download jars for S3A + PostgreSQL JDBC
              JARS_DIR=/opt/spark/jars
              for jar in \
                "https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar" \
                "https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar" \
                "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar"; do
                fname=$(basename "$jar")
                if [ ! -f "$JARS_DIR/$fname" ]; then
                  echo "Downloading $fname..."
                  wget -q -O "$JARS_DIR/$fname" "$jar"
                fi
              done

              echo "Starting Spark Thrift Server..."
              /opt/spark/sbin/start-thriftserver.sh \
                --master spark://spark-master.data-platform.svc.cluster.local:7077 \
                --conf spark.driver.host=$(hostname -i) \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.executor.memory=512m \
                --conf spark.hadoop.fs.s3a.endpoint=http://minio.data-platform.svc.cluster.local:9000 \
                --conf spark.hadoop.fs.s3a.access.key=${MINIO_ACCESS_KEY} \
                --conf spark.hadoop.fs.s3a.secret.key=${MINIO_SECRET_KEY} \
                --conf spark.hadoop.fs.s3a.path.style.access=true \
                --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                --conf spark.sql.warehouse.dir=s3a://processed-data/warehouse \
                --hiveconf hive.server2.thrift.port=10000 \
                --hiveconf hive.server2.thrift.bind.host=0.0.0.0 \
                --hiveconf javax.jdo.option.ConnectionURL=jdbc:postgresql://postgres.data-platform.svc.cluster.local:5432/hive_metastore \
                --hiveconf javax.jdo.option.ConnectionDriverName=org.postgresql.Driver \
                --hiveconf javax.jdo.option.ConnectionUserName=${POSTGRES_USER} \
                --hiveconf javax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD} \
                --hiveconf datanucleus.schema.autoCreateAll=false \
                --hiveconf hive.metastore.schema.verification=true

              # start-thriftserver.sh backgrounds; tail the log to keep container alive
              tail -f /opt/spark/logs/spark-*.out
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 10000
              name: thrift
            - containerPort: 4040
              name: spark-ui
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # Startup takes a while (jar downloads on first boot)
          startupProbe:
            tcpSocket:
              port: 10000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10000
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spark-thrift
  namespace: data-platform
  labels:
    app: spark-thrift
spec:
  type: NodePort
  selector:
    app: spark-thrift
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
      nodePort: 30100
    - name: spark-ui
      port: 4040
      targetPort: 4040
