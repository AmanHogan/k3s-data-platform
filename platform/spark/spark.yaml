# Apache Spark standalone cluster for the k3s data platform.
# One master + one worker. Worker gets the bulk of the memory for actual
# processing. Both pods can reach MinIO via its ClusterIP service.
#
# Image: official apache/spark from Docker Hub
#
# PySpark notebooks (JupyterHub) and Airflow jobs connect to the master at:
#   spark://spark-master.data-platform.svc.cluster.local:7077
#
# Spark UI available via NodePort (port 30808) on Tailscale IP.
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform
---
# ──────────────────────────────────────────────
# Spark Master
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: data-platform
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Unset k8s-injected service env vars that conflict with Spark's scripts
              unset SPARK_MASTER_PORT SPARK_MASTER_HOST SPARK_WORKER_PORT
              /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master \
                --host 0.0.0.0 \
                --port 7077 \
                --webui-port 8080
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          ports:
            - containerPort: 7077
              name: spark
            - containerPort: 8080
              name: webui
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: data-platform
  labels:
    app: spark-master
spec:
  type: ClusterIP
  selector:
    app: spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: webui
      port: 8080
      targetPort: 8080
---
# Spark Master Web UI — NodePort for Tailscale access
apiVersion: v1
kind: Service
metadata:
  name: spark-master-ui
  namespace: data-platform
  labels:
    app: spark-master
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30808
---
# ──────────────────────────────────────────────
# Spark Worker
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: data-platform
  labels:
    app: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Unset k8s-injected service env vars that conflict with Spark's scripts
              unset SPARK_WORKER_PORT SPARK_MASTER_PORT SPARK_MASTER_HOST
              /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
                --webui-port 8081 \
                --memory 2g \
                --cores 2 \
                spark://spark-master.data-platform.svc.cluster.local:7077
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: SPARK_WORKER_MEMORY
              value: "3g"
            - name: SPARK_WORKER_CORES
              value: "2"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          ports:
            - containerPort: 8081
              name: webui
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: data-platform
  labels:
    app: spark-worker
spec:
  type: ClusterIP
  selector:
    app: spark-worker
  ports:
    - name: webui
      port: 8081
      targetPort: 8081
