# Jenkins Helm values for the k3s data platform.
# Chart: jenkins/jenkins  (https://charts.jenkins.io)
# Namespace: cicd
#
# Access: via `kubectl port-forward -n cicd svc/jenkins 8080:8080` for now
# (MetalLB LB IP is not directly reachable from the Mac over WiFi). The
# LoadBalancer service is still defined so it has a stable in-cluster identity
# and can be reached over the LAN/Tailscale-subnet-router later.

controller:
  # The chart's default list, except configuration-as-code. Dependencies always
  # resolve to their latest version; in Oct 2026 the latest `credentials` needed
  # configuration-as-code 2117+, and the chart's pinned 2082 made the init
  # container crash-loop. Bump this pin if that error comes back.
  installPlugins:
    - kubernetes:4423.vb_59f230b_ce53
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2117.vc05a_0b_e6b_f4e
  # Install plugins on first start only; they then live on the PVC. Without this,
  # every pod restart re-downloads plugins, and any upstream release can break a
  # reboot. To upgrade plugins later, use the Jenkins UI.
  initializeOnce: true
  additionalPlugins:
    - docker-workflow          # build/push Docker images from pipelines
    - credentials-binding      # bind GitHub/registry creds in pipelines

  serviceType: LoadBalancer
  loadBalancerIP: 192.168.4.246
  servicePort: 8080
  jenkinsUrlProtocol: http

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Keep the admin user/password in a chart-managed secret (retrieved below).
  admin:
    username: admin

persistence:
  enabled: true
  storageClass: local-path
  size: 8Gi

# The Kubernetes plugin spawns ephemeral build agents as pods in-cluster.
agent:
  enabled: true
  namespace: cicd
  resources:
    requests:
      cpu: "256m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
