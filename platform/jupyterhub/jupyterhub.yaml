# JupyterHub single-user deployment for the k3s data platform.
# Runs a Jupyter notebook server with PySpark pre-configured to connect
# to the Spark master and MinIO (S3A).
#
# This is a simple single-user setup (not the full JupyterHub multi-user
# Helm chart) — perfect for a homelab where you're the only user.
#
# Access via NodePort on Tailscale IP:
#   http://100.112.249.53:30888
#
# Notebooks are persisted on a PVC so they survive pod restarts.
# You can also save/load notebooks from MinIO buckets.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-notebooks
  namespace: data-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  namespace: data-platform
  labels:
    app: jupyterhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterhub
  strategy:
    type: Recreate  # PVC is ReadWriteOnce
  template:
    metadata:
      labels:
        app: jupyterhub
    spec:
      containers:
        - name: jupyter
          # Same Spark version as the cluster (3.5.9) with Jupyter installed on top.
          # Using the official Apache Spark image and installing Jupyter at startup
          # to guarantee version alignment with spark-master and spark-worker.
          image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
          command: ["/bin/bash", "-c"]
          args:
            - |
              export HOME=/tmp/jupyter-home
              export PATH=$HOME/.local/bin:$PATH
              export SPARK_HOME=/opt/spark
              export PYTHONPATH=$SPARK_HOME/python:$SPARK_HOME/python/lib/py4j-0.10.9.7-src.zip:$PYTHONPATH
              export SPARK_CONF_DIR=/tmp/spark-conf
              mkdir -p $HOME/.ivy2 /tmp/spark-conf /tmp/spark-local
              echo "spark.jars.ivy $HOME/.ivy2" > /tmp/spark-conf/spark-defaults.conf
              echo "spark.local.dir /tmp/spark-local" >> /tmp/spark-conf/spark-defaults.conf
              mkdir -p $HOME /tmp/jupyter-work
              mkdir -p $HOME/.ipython/profile_default/startup
              cat > $HOME/.ipython/profile_default/startup/00-spark-session.py << 'PYEOF'
              # Auto-run for every new kernel so `spark` is ready without
              # pasting the SparkSession boilerplate into each notebook.
              # Same config as starter-notebook.ipynb's first cell.
              import os
              from pyspark.sql import SparkSession

              spark = SparkSession.builder \
                  .appName("Kubenex-Notebook") \
                  .master(os.environ.get("SPARK_MASTER", "local[*]")) \
                  .config("spark.driver.host", os.environ.get("SPARK_DRIVER_HOST", "localhost")) \
                  .config("spark.driver.port", os.environ.get("SPARK_DRIVER_PORT", "45083")) \
                  .config("spark.driver.bindAddress", "0.0.0.0") \
                  .config("spark.executor.memory", "512m") \
                  .config("spark.hadoop.fs.s3a.endpoint", os.environ["MINIO_ENDPOINT"]) \
                  .config("spark.hadoop.fs.s3a.access.key", os.environ["MINIO_ACCESS_KEY"]) \
                  .config("spark.hadoop.fs.s3a.secret.key", os.environ["MINIO_SECRET_KEY"]) \
                  .config("spark.hadoop.fs.s3a.path.style.access", "true") \
                  .config("spark.hadoop.fs.s3a.impl", "org.apache.hadoop.fs.s3a.S3AFileSystem") \
                  .config("spark.jars.packages", "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262") \
                  .getOrCreate()

              print(f"Spark session ready — v{spark.version}, master={spark.sparkContext.master}")
              PYEOF
              pip install --quiet --user jupyter notebook pandas numpy matplotlib boto3 && \
              cd /tmp/jupyter-work && \
              jupyter notebook \
                --ip=0.0.0.0 \
                --port=8888 \
                --no-browser \
                --allow-root \
                --NotebookApp.token='' \
                --NotebookApp.password='' \
                --NotebookApp.allow_origin='*' \
                --notebook-dir=/tmp/jupyter-work
          env:
            # Connect to the Spark standalone cluster
            - name: SPARK_MASTER
              value: spark://spark-master.data-platform.svc.cluster.local:7077
            # Pod IP so Spark executors can call back to the driver
            - name: SPARK_DRIVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_DRIVER_PORT
              value: "45083"
            # MinIO S3A config — available in notebook sessions
            - name: MINIO_ENDPOINT
              value: http://minio.data-platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            # Disable token auth for homelab (Tailscale-only access)
            - name: JUPYTER_TOKEN
              value: ""
            # Grant sudo so you can pip install in the container
            - name: GRANT_SUDO
              value: "yes"
          ports:
            - containerPort: 8888
              name: notebook
          volumeMounts:
            - name: notebooks
              mountPath: /tmp/jupyter-work
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Jupyter can take a moment to start
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: jupyter-notebooks
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  namespace: data-platform
  labels:
    app: jupyterhub
spec:
  type: NodePort
  selector:
    app: jupyterhub
  ports:
    - name: notebook
      port: 8888
      targetPort: 8888
      nodePort: 30888
