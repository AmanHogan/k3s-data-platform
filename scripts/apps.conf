# Shared settings for apps-save.sh, apps-down.sh and apps-up.sh.

# The project namespaces. Infrastructure (argocd, cicd, cloudflare, metallb,
# kube-system) is NOT listed and is never touched.
APP_NAMESPACES=(kubenex tracker proxmox-visualizer c4-diagram commitments data-platform portfolio)

# Helm chart repos, for reinstalling saved releases. Key = chart name.
helm_repo_url() {
  case "$1" in
    minio) echo "https://charts.min.io/" ;;
    *) echo "No repo URL known for Helm chart '$1'. Add it to scripts/apps.conf." >&2; return 1 ;;
  esac
}
